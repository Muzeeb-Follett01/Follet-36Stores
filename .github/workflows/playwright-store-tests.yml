name: Playwright Store Tests

on:
  # Manual trigger with inputs
  workflow_dispatch:
    inputs:
      store_ids:
        description: "Store IDs — comma-separated (e.g. 0026,0029,0030,0031,0032)"
        required: true
        default: "0026"
      browser:
        description: "Browser to use"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
      upload_to_jira:
        description: "Upload results to Jira after tests?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  NODE_OPTIONS: ""

jobs:
  # Convert comma-separated store IDs into a JSON array for matrix
  prepare:
    name: Prepare store list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build matrix from input
        id: set-matrix
        run: |
          STORES=$(echo "${{ github.event.inputs.store_ids }}" | tr -d ' ' | jq -R -c 'split(",")')
          echo "matrix={\"store_id\":$STORES}" >> $GITHUB_OUTPUT

  playwright-tests:
    name: "Store ${{ matrix.store_id }} — 12 Specs"
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run all 12 spec files
        run: |
          npx playwright test `
            tests/tdd/TMSHOP-450.spec.ts `
            tests/tdd/TMSHOP-453.spec.ts `
            tests/tdd/TMSHOP-454.spec.ts `
            tests/tdd/TMSHOP-455.spec.ts `
            tests/tdd/TMSHOP-456.spec.ts `
            tests/tdd/TMSHOP-457.spec.ts `
            tests/tdd/TMSHOP-458.spec.ts `
            tests/tdd/TMSHOP-459.spec.ts `
            tests/tdd/TMSHOP-460.spec.ts `
            tests/tdd/TMSHOP-461.spec.ts `
            tests/tdd/TMSHOP-462.spec.ts `
            tests/tdd/TMSHOP-463.spec.ts `
            --project="${{ github.event.inputs.browser }}" `
            --workers=1 `
            --reporter=dot,junit,html
        env:
          CI: true
          EXCEL_FILE: bkstr-${{ matrix.store_id }}.xlsx
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.store_id }}
          path: |
            test-results/${{ matrix.store_id }}/
            playwright-report/
            notify-results/test-results.xml
          retention-days: 30

      - name: Upload screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-videos-${{ matrix.store_id }}
          path: test-results/${{ matrix.store_id }}/
          retention-days: 30

      - name: Verify Jira credentials
        if: github.event.inputs.upload_to_jira == 'true' && always()
        run: |
          if ([string]::IsNullOrEmpty("${{ secrets.JIRA_BASE_URL }}")) {
            Write-Host "WARNING: JIRA_BASE_URL secret is not set"
          } else {
            Write-Host "JIRA_BASE_URL is configured"
          }
          if ([string]::IsNullOrEmpty("${{ secrets.JIRA_API_TOKEN }}")) {
            Write-Host "WARNING: JIRA_API_TOKEN secret is not set"
          } else {
            Write-Host "JIRA_API_TOKEN is configured"
          }

      - name: Attach results to Jira
        if: github.event.inputs.upload_to_jira == 'true' && always()
        continue-on-error: true
        run: |
          npx ts-node --transpile-only scripts/jiraAttach.ts ${{ matrix.store_id }}
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: TMSHOP
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "Playwright Results — Store ${{ matrix.store_id }}"
          path: notify-results/test-results.xml
          reporter: java-junit
          fail-on-error: false
